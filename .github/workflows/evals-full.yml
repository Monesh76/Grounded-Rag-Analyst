name: Full evals (LLM judge)

# Costs real money (generation + judge calls), so this never runs on every PR
# push -- only when someone explicitly asks for it (the run-full-evals label)
# or on the nightly schedule. Needs the real production corpus loaded, so it
# targets a persistent database via repository secrets, not CI's ephemeral
# service container (which the default lint-and-test job already covers with
# the free fixture in eval-ci).

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 7 * * *"

jobs:
  eval-full:
    if: github.event_name == 'schedule' || github.event.label.name == 'run-full-evals'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Full pipeline eval against the production database
        run: |
          uv run python -m evals.run_evals --full --run-id nightly-latest
          uv run pytest evals/test_evals.py -v

      - name: "Commit nightly results (CLAUDE.md rule: eval results are committed)"
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "chore: nightly full eval results [skip ci]"
          git push

      - name: Post eval results as a PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('results/nightly-latest.md', 'utf8');
            const marker = '<!-- filings-rag-eval-full-comment -->';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n${body}`,
            });
