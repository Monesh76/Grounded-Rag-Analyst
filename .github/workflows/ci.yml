name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # PR comment step needs write access; harmless (and unused) on push-to-main
    # runs, which have no PR to comment on.
    permissions:
      contents: read
      pull-requests: write

    services:
      # Same image as docker-compose.yml so CI matches local runs.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filings
          POSTGRES_PASSWORD: filings
          POSTGRES_DB: filings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filings -d filings"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://filings:filings@localhost:5432/filings

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Retrieval-only eval against the committed fixture
        run: make eval-ci

      - name: Post eval results as a PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('results/ci-latest.md', 'utf8');
            const marker = '<!-- filings-rag-eval-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            const commentBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
