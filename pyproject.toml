[project]
name = "filings-rag"
version = "0.1.0"
description = "Question answering over SEC 10-K filings with grounded citations and an evaluation harness."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "sentence-transformers>=6.1.0",
    "pgvector>=0.5.0",
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "deepeval>=4.2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends(...) as a default argument is FastAPI's documented dependency-
# injection idiom, not the mutable-default-argument bug B008 is meant to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
# evals/ lives at the repo root (alongside src/), not inside the installed
# package, so it isn't importable without this: tests exercise it directly.
pythonpath = ["."]
markers = [
    "integration: needs a running Postgres (docker compose up -d db)",
]
